name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gradle-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Build and test
        run: ./gradlew build --no-daemon
