plugins {
    id 'java-library'
}

group = 'com.itmeansbigmountain'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(11)
    }
    withSourcesJar()
}

jar {
    archiveBaseName = 'osrs-plugins-boilerplate'
    manifest {
        attributes(
            'Implementation-Title': 'OSRS Plugins Boilerplate API Helpers',
            'Implementation-Version': project.version
        )
    }
}

tasks.register('smokeTest', JavaExec) {
    group = 'verification'
    description = 'Runs offline smoke tests for API helper URL construction and public method surface.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.itmeansbigmountain.osrsapi.ApiClientSmokeTest'
}

tasks.named('test') {
    enabled = false
}

tasks.named('check') {
    dependsOn tasks.named('smokeTest')
}
