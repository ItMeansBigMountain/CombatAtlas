openapi: 3.0.0
info:
  title: Chat Session API
  version: 1.0.0
servers:
  - url: https://reasonably-fit-impala.ngrok-free.app
paths:
  /chats/:
    get:
      summary: List all chat sessions
      operationId: listChatSessions 
      security:
        - oauth2: ["https://www.googleapis.com/auth/userinfo.email"]
      parameters: []
      #   - name: ngrok-skip-browser-warning
      #     in: header
      #     required: false
      #     schema:
      #       type: string
      #       default: "true"
      responses:
        "200":
          description: A list of chat sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatSession"
    post:
      summary: Create a new chat session
      operationId: createChatSession
      security:
        - oauth2: ["https://www.googleapis.com/auth/userinfo.email"]
      parameters: []
      #   - name: ngrok-skip-browser-warning
      #     in: header
      #     required: false
      #     schema:
      #       type: string
      #       default: "true"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatSession"
      responses:
        "201":
          description: A new chat session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSession"
  /chats/{sessionId}/:
    get:
      summary: Retrieve a chat session
      operationId: getChatSession 
      security:
        - oauth2: ["https://www.googleapis.com/auth/userinfo.email"]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
        # - name: ngrok-skip-browser-warning
        #   in: header
        #   required: false
        #   schema:
        #     type: string
        #     default: "true"
      responses:
        "200":
          description: A single chat session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSession"
    put:
      summary: Update a chat session
      operationId: updateChatSession
      security:
        - oauth2: ["https://www.googleapis.com/auth/userinfo.email"]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
        # - name: ngrok-skip-browser-warning
        #   in: header
        #   required: false
        #   schema:
        #     type: string
        #     default: "true"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatSession"
      responses:
        "200":
          description: Updated chat session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSession"
components:
  schemas:
    ChatSession:
      type: object
      properties:
        session_id:
          type: string
        user_id:
          type: integer
        session_data:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          tokenUrl: https://oauth2.googleapis.com/token
          scopes:
            https://www.googleapis.com/auth/userinfo.email: Access user email
components:
  schemas:
    ChatSession:
      properties:
        created_at:
          format: date-time
          type: string
        session_data:
          additionalProperties: true
          type: object
        session_id:
          type: string
        updated_at:
          format: date-time
          type: string
        user_id:
          type: integer
      type: object
  securitySchemes:
    oauth2:
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/auth
          scopes:
            https://www.googleapis.com/auth/userinfo.email: Access user email
          tokenUrl: https://oauth2.googleapis.com/token
      type: oauth2
info:
  title: Chat Session API
  version: 1.0.0
openapi: 3.0.0
paths:
  /chats/:
    get:
      operationId: listChatSessions
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ChatSession'
                type: array
          description: A list of chat sessions
      security:
      - oauth2:
        - https://www.googleapis.com/auth/userinfo.email
      summary: List all chat sessions
    post:
      operationId: createChatSession
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatSession'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSession'
          description: A new chat session created
      security:
      - oauth2:
        - https://www.googleapis.com/auth/userinfo.email
      summary: Create a new chat session
  /chats/{sessionId}/:
    get:
      operationId: getChatSession
      parameters:
      - in: path
        name: sessionId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSession'
          description: A single chat session
      security:
      - oauth2:
        - https://www.googleapis.com/auth/userinfo.email
      summary: Retrieve a chat session
    put:
      operationId: updateChatSession
      parameters:
      - in: path
        name: sessionId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatSession'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSession'
          description: Updated chat session
      security:
      - oauth2:
        - https://www.googleapis.com/auth/userinfo.email
      summary: Update a chat session
  /privacy-policy/:
    get:
      description: Returns the privacy policy of the application as a JSON object.
      operationId: privacyPolicy
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  Data Collection and Use:
                    type: string
                  Introduction:
                    type: string
                type: object
          description: A JSON object containing the privacy policy
      summary: Retrieve the privacy policy
servers:
- url: https://reasonably-fit-impala.ngrok-free.app
