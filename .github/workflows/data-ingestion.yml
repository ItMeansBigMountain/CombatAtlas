name: Data Ingestion

on:
  schedule:
    # Daily at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Data source to ingest (bjjdata, wikipedia, or all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - bjjdata
          - wikipedia

permissions:
  contents: read

concurrency:
  group: combatatlas-data-ingestion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ingest:
    name: Provenance-aware data ingestion
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run bjjdata importer
        if: ${{ github.event_name == 'schedule' || github.event.inputs.source == 'all' || github.event.inputs.source == 'bjjdata' }}
        run: npm run import:bjjdata

      - name: Run Wikipedia importer
        if: ${{ github.event_name == 'schedule' || github.event.inputs.source == 'all' || github.event.inputs.source == 'wikipedia' }}
        run: npm run import:wikipedia

      - name: Validate data
        run: npm run validate:data

      - name: Summarize changes
        run: |
          if git diff --quiet imports/; then
            echo "No normalized import changes." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Normalized import changes are available in the workflow artifact for human review." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload provenance-validated imports
        uses: actions/upload-artifact@v4
        with:
          name: provenance-validated-imports-${{ github.run_id }}
          path: |
            imports/*-normalized.json
            imports/ATTRIBUTION.md
          retention-days: 14
          if-no-files-found: error