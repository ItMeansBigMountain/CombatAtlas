name: CombatAtlas Preview

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: combatatlas-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel preview configuration
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Vercel artifact
        run: vercel build --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy preview
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")"
          printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"
          printf 'Preview URL: %s\n' "$url" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Smoke test preview
        run: |
          vercel curl "${{ steps.deploy.outputs.url }}" \
            --token="$VERCEL_TOKEN" \
            --output /tmp/combatatlas-preview.html
          grep --fixed-strings '<title>CombatAtlas — Martial Arts Drill Database</title>' \
            /tmp/combatatlas-preview.html
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
