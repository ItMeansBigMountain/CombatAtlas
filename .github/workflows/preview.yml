name: Preview

on:
  push:
    branches-ignore: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: combatatlas-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Deploy preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js (web)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install web dependencies
        run: npm ci

      - name: Test web
        run: npm test

      - name: Build web
        run: npm run build

      - name: Deploy web preview
        id: web-deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Set up Node.js (mobile)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci
        working-directory: mobile

      - name: Test mobile
        run: npm test
        working-directory: mobile

      - name: Export mobile web
        run: npm run export:web
        working-directory: mobile

      - name: Deploy mobile preview
        id: mobile-deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_MOBILE_PROJECT_ID }}
          working-directory: mobile

      - name: Comment preview URLs on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const webUrl = '${{ steps.web-deploy.outputs.preview-url }}';
            const mobileUrl = '${{ steps.mobile-deploy.outputs.preview-url }}';
            const body = `## 🔗 CombatAtlas Preview Deployments\n\n**Web (Vite):** ${webUrl}\n\n**Mobile Web (Expo):** ${mobileUrl}\n\n_These are immutable preview URLs from this PR's workflow run._`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });