name: Preview

on:
  push:
    branches-ignore: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: combatatlas-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Deploy preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js (web)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install web dependencies
        run: npm ci

      - name: Test web
        run: npm test

      - name: Build web
        run: npm run build

      - name: Install current Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy web preview
        id: web-deploy
        run: |
          url="$(vercel deploy --token="$VERCEL_TOKEN")"
          printf 'preview-url=%s\n' "$url" >> "$GITHUB_OUTPUT"
          printf 'Web preview: %s\n' "$url" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Set up Node.js (mobile)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci
        working-directory: mobile

      - name: Test mobile
        run: npm test
        working-directory: mobile

      - name: Export mobile web
        run: npm run export:web
        working-directory: mobile

      - name: Comment preview URLs on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const webUrl = '${{ steps.web-deploy.outputs.preview-url }}';
            const body = `## CombatAtlas preview\n\n**Web (Vite):** ${webUrl}\n\nThe Expo web export was verified in CI. Native test routes are tracked through EAS, not Vercel.\n\n_This is an immutable preview URL from this PR's workflow run._`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });