name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: combatatlas-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # GATE 1: Quality — type-check + build (web + mobile)
  quality-gate:
    name: Quality gate (type-check / build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js (web)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install web dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test web
        run: npm test

      - name: Build web (Vite)
        run: npm run build

      - name: Verify web output
        run: |
          if [ ! -f dist/index.html ]; then
            echo "ERROR: dist/index.html not found after vite build"
            exit 1
          fi
          echo "Vite web build verified: $(wc -c < dist/index.html) bytes"

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build-artifact
          path: dist/
          retention-days: 1

      - name: Set up Node.js (mobile)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci
        working-directory: mobile

      - name: Test mobile
        run: npm test
        working-directory: mobile

      - name: Build mobile web (Expo export)
        run: npm run export:web
        working-directory: mobile

      - name: Verify mobile web output
        run: |
          if [ ! -f mobile/dist/index.html ]; then
            echo "ERROR: mobile/dist/index.html not found after expo export"
            exit 1
          fi
          echo "Expo web export verified: $(wc -c < mobile/dist/index.html) bytes"

      - name: Upload mobile web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-web-build-artifact
          path: mobile/dist/
          retention-days: 1

  # GATE 2: Mobile-web — responsive viewport + interaction
  mobile-web-gate:
    name: Mobile-web gate (390 x 844 viewport + interaction)
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download web build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build-artifact
          path: dist/

      - name: Download mobile web build artifact
        uses: actions/download-artifact@v4
        with:
          name: mobile-web-build-artifact
          path: mobile-dist/

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright + deps
        run: npx playwright install --with-deps chromium

      - name: Mobile viewport check (390 x 844)
        run: |
          npx playwright test -c - <<'EOF'
          import { test, expect } from '@playwright/test';
          test('mobile viewport', async ({ page }) => {
            await page.goto(process.env.BASE_URL || 'https://combatatlas-flame.vercel.app', { waitUntil: 'networkidle' });
            await page.setViewportSize({ width: 390, height: 844 });
            const title = await page.title();
            expect(title).toContain('CombatAtlas');
            const body = await page.textContent('body');
            expect(body).toContain('Martial Arts');
            console.log('Mobile viewport check passed');
          });
          EOF
        env:
          BASE_URL: ${{ vars.STAGING_URL || 'https://combatatlas-flame.vercel.app' }}

      - name: Mobile interaction check (nav link click)
        run: |
          npx playwright test -c - <<'EOF'
          import { test, expect } from '@playwright/test';
          test('mobile interaction', async ({ page }) => {
            await page.goto(process.env.BASE_URL || 'https://combatatlas-flame.vercel.app', { waitUntil: 'networkidle' });
            await page.setViewportSize({ width: 390, height: 844 });
            const links = await page.locator('a[href]').all();
            if (links.length > 0) {
              await links[0].click({ force: true });
              await page.waitForLoadState('networkidle');
              console.log('Mobile interaction check passed');
            } else {
              console.log('No links found, skipping click');
            }
          });
          EOF
        env:
          BASE_URL: ${{ vars.STAGING_URL || 'https://combatatlas-flame.vercel.app' }}

  # GATE 3: Desktop — viewport + functionality
  desktop-gate:
    name: Desktop gate (1440 x 900 viewport + key flows)
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download web build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build-artifact
          path: dist/

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright + deps
        run: npx playwright install --with-deps chromium

      - name: Desktop viewport check (1440 x 900)
        run: |
          npx playwright test -c - <<'EOF'
          import { test, expect } from '@playwright/test';
          test('desktop viewport', async ({ page }) => {
            await page.goto(process.env.BASE_URL || 'https://combatatlas-flame.vercel.app', { waitUntil: 'networkidle' });
            await page.setViewportSize({ width: 1440, height: 900 });
            const title = await page.title();
            expect(title).toContain('CombatAtlas');
            const body = await page.textContent('body');
            expect(body).toContain('Martial Arts');
            console.log('Desktop viewport check passed');
          });
          EOF
        env:
          BASE_URL: ${{ vars.STAGING_URL || 'https://combatatlas-flame.vercel.app' }}

      - name: Desktop functionality check (key user flows)
        run: |
          npx playwright test -c - <<'EOF'
          import { test, expect } from '@playwright/test';
          test('desktop functionality', async ({ page }) => {
            await page.goto(process.env.BASE_URL || 'https://combatatlas-flame.vercel.app', { waitUntil: 'networkidle' });
            await page.setViewportSize({ width: 1440, height: 900 });
            // Check for art cards or drill list
            const cards = await page.locator('[class*="card"], [class*="drill"], [class*="art"]').count();
            expect(cards).toBeGreaterThan(0);
            console.log('Desktop functionality check passed');
          });
          EOF
        env:
          BASE_URL: ${{ vars.STAGING_URL || 'https://combatatlas-flame.vercel.app' }}

  # GATE 4: Gate summary + deploy blocker
  gate-summary:
    name: Gate summary (blocks deploy on failure)
    runs-on: ubuntu-latest
    needs: [quality-gate, mobile-web-gate, desktop-gate]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all gate artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: gate-artifacts/
          merge-multiple: true

      - name: Fail if any upstream gate failed
        run: |
          FAILED=""
          for job in quality-gate mobile-web-gate desktop-gate; do
            conclusion=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs \
              --jq ".jobs[] | select(.name == \"$job\") | .conclusion" 2>/dev/null || echo "failure")
            if [ "$conclusion" != "success" ]; then
              echo "FAILURE: $job concluded as $conclusion"
              FAILED="$FAILED $job"
            fi
          done
          if [ -n "$FAILED" ]; then
            echo "Deploy blocked - failed gates:$FAILED"
            exit 1
          fi
          echo "All promotion gates passed. Proceeding to deploy."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # DEPLOY: runs only after all gates pass
  deploy-production:
    name: Deploy to production (Vercel)
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL || 'https://combatatlas-flame.vercel.app' }}
    needs: [quality-gate, mobile-web-gate, desktop-gate, gate-summary]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Deploy to Vercel (production)
        run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}