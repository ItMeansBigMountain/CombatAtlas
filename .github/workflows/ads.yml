name: Ad SDK Integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: combatatlas-ads-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ad-sdk-test:
    name: Ad SDK integration test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js (mobile)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci
        working-directory: mobile

      - name: Run monetization integration tests
        run: npm test
        working-directory: mobile

      - name: Validate development ad policy
        run: |
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import { AD_POLICY, canShowInterstitial, developmentAdAdapter } from './src/monetization.js';
          assert.equal(developmentAdAdapter.mode, 'test');
          assert.match(developmentAdAdapter.bannerUnitId, /^test-/);
          assert.match(developmentAdAdapter.interstitialUnitId, /^test-/);
          assert.equal(canShowInterstitial({
            preferences: { consent: 'unset', removeAds: false },
            session: { interstitialCount: 0, actionsSinceInterstitial: AD_POLICY.minActionsBetweenInterstitials, lastInterstitialAt: 0 },
          }), false);
          console.log('Consent-first, test-ID-only ad policy verified');
          EOF
        working-directory: mobile