name: Mobile Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Approved internal test platform
        required: true
        type: choice
        options: [ios, android, all]

permissions:
  contents: read

concurrency:
  group: combatatlas-mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # EAS iOS dev build
  ios-dev:
    name: EAS iOS dev build
    runs-on: macos-latest
    timeout-minutes: 45
    if: inputs.platform == 'ios' || inputs.platform == 'all'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci
        working-directory: mobile

      - name: Install EAS CLI
        run: npm install --global eas-cli@latest

      - name: Configure EAS
        run: eas whoami
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS internal preview
        run: eas build --platform ios --profile preview --non-interactive --no-wait
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  # EAS Android internal track
  android-internal:
    name: EAS Android internal
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: inputs.platform == 'android' || inputs.platform == 'all'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci
        working-directory: mobile

      - name: Install EAS CLI
        run: npm install --global eas-cli@latest

      - name: Configure EAS
        run: eas whoami
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android internal
        run: eas build --platform android --profile internal --non-interactive --no-wait
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
